name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm ci --prefix worker
      - run: npm test
      - run: npm run lint:contract
      - run: npm run typecheck
      - run: npm run ingest:sample
      - run: npm --prefix worker run deploy:dry-run
